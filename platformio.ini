[platformio]
default_envs = m5paper
core_dir = .pio/core

[env:m5paper]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_config.py
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.embed_files = certs/roots.bundle
board_build.embed_txtfiles = certs/google-roots.pem
build_flags =
    -DARDUINO_M5STACK_PAPER
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    m5stack/M5Unified@0.2.11
    m5stack/M5GFX@0.2.17
    https://github.com/takkaO/OpenFontRender.git#a9acf5498ed058a034acaa1becbad790627b9ec1
